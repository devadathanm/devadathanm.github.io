<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Devadathan M</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#070b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&amp;family=Public+Sans:wght@300;400&amp;family=JetBrains+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css">
<style>
.lost{min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 0;position:relative;overflow:hidden}
.lost .code{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,24px);font:200 clamp(90px,25vw,280px)/1 Outfit,sans-serif;letter-spacing:-.04em;-webkit-user-select:none;user-select:none}
.bearing-btn{width:clamp(90px,22vw,240px);height:clamp(90px,22vw,240px);background:none;border:0;padding:0;cursor:pointer;color:var(--acc);display:block;position:relative;z-index:2;-webkit-user-select:none;user-select:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.bearing-btn:hover{transform:scale(1.08)}
.bearing-btn:active{transform:scale(0.95)}

/* Bearing Animation */
.bearing-btn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--acc) 45%,transparent));transition:filter .4s}
.bearing-btn .inner-race{transform-origin:60px 60px;animation:spin 20s linear infinite}
.bearing-btn .ball-cage{transform-origin:60px 60px;animation:spin 30s linear infinite reverse}
.bearing-btn.fast .inner-race{animation-duration:0.6s}
.bearing-btn.fast .ball-cage{animation-duration:0.9s}
.bearing-btn.fast svg{filter:drop-shadow(0 0 28px var(--acc)) drop-shadow(0 0 56px var(--acc))}

@keyframes spin{to{transform:rotate(360deg)}}

/* Engineering Blueprint Graphic Grid & Radars */
.lost-bg-art{position:absolute;inset:0;z-index:-1;pointer-events:none;display:grid;place-items:center}
.lost-bg-art svg{width:min(95vw,800px);height:min(95vw,800px);overflow:visible;opacity:.5}
.lost-bg-art .ring{fill:none;stroke:var(--acc);stroke-width:1;opacity:.35}
.lost-bg-art .track{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 10;animation:spin 50s linear infinite}
.lost-bg-art .track-rev{fill:none;stroke:var(--acc2);stroke-width:1.2;stroke-dasharray:15 15;animation:spinRev 40s linear infinite}
.lost-bg-art .center-cross{stroke:var(--acc);stroke-width:1;opacity:.6}
@keyframes spinRev{to{transform:rotate(-360deg)}}

/* Ambient Glow & Ripple Shockwave */
.lost-glow{position:absolute;inset:-20%;background:radial-gradient(closest-side at 50% 45%,color-mix(in srgb,var(--acc) 22%,transparent),transparent);animation:breathe 7s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}

.bearing-ripple{position:absolute;top:50%;left:50%;width:100%;height:100%;border:2px solid var(--acc);border-radius:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;box-shadow:0 0 20px var(--acc)}
.bearing-ripple.act{animation:rippleBurst .7s cubic-bezier(.1, .8, .3, 1) forwards}
@keyframes rippleBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}

/* Particle Sparks */
.spark-container{position:absolute;inset:0;pointer-events:none;z-index:3}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);opacity:0}
.spark.act{animation:sparkFly .5s cubic-bezier(.25,.46,.45,.94) forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

.lost h1{font:200 clamp(26px,4vw,44px)/1.2 Outfit,sans-serif;margin-top:28px}
.lost p.msg{color:var(--mute);margin:14px auto 0;max-width:30em;font-size:clamp(16px,1.6vw,18px)}
.lost p.hint{margin-top:18px;font-size:14px;color:var(--acc);min-height:1.4em;transition:opacity .3s}
.lost .actions{justify-content:center;margin-top:30px}
.lost .blueprint{position:absolute;inset:0;z-index:-2;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.5;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 70%)}

@media (prefers-reduced-motion:reduce){
  .bearing-btn svg *, .lost-bg-art *, .lost-glow { animation: none !important; transform: none !important; }
  .spark, .bearing-ripple { display: none !important; }
}
</style>
</head>
<body>
<main class="lost" id="main">
  <div class="blueprint" aria-hidden="true"></div>
  <div class="lost-glow" aria-hidden="true"></div>
  
  <div class="lost-bg-art" aria-hidden="true">
    <svg viewBox="0 0 800 800">
      <circle class="ring" cx="400" cy="400" r="360" stroke-dasharray="6 6"/>
      <circle class="track" cx="400" cy="400" r="280"/>
      <circle class="track-rev" cx="400" cy="400" r="190"/>
      <ellipse class="ring" cx="400" cy="400" rx="380" ry="140" transform="rotate(45 400 400)"/>
      <line class="center-cross" x1="50" y1="400" x2="750" y2="400"/>
      <line class="center-cross" x1="400" y1="50" x2="400" y2="750"/>
      <circle cx="400" cy="400" r="4" fill="var(--acc)"/>
    </svg>
  </div>

  <div>
    <div class="code" aria-label="404">
      <span>4</span>
      <button class="bearing-btn" id="bearingBtn" type="button" aria-label="Precision radial ball bearing assembly. Tap to activate spin.">
        <div class="bearing-ripple" id="ripple" aria-hidden="true"></div>
        <div class="spark-container" id="sparks" aria-hidden="true"></div>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <!-- Outer Ring (Static housing) -->
          <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="3"/>
          <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 4"/>
          
          <!-- Ball Bearings & Cage (Counter-rotating) -->
          <g class="ball-cage">
            <circle cx="60" cy="22" r="5" fill="var(--acc2)"/>
            <circle cx="86.8" cy="33.2" r="5" fill="var(--acc2)"/>
            <circle cx="98" cy="60" r="5" fill="var(--acc2)"/>
            <circle cx="86.8" cy="86.8" r="5" fill="var(--acc2)"/>
            <circle cx="60" cy="98" r="5" fill="var(--acc2)"/>
            <circle cx="33.2" cy="86.8" r="5" fill="var(--acc2)"/>
            <circle cx="22" cy="60" r="5" fill="var(--acc2)"/>
            <circle cx="33.2" cy="33.2" r="5" fill="var(--acc2)"/>
          </g>

          <!-- Inner Race & Shaft Bore (Rotating) -->
          <g class="inner-race">
            <circle cx="60" cy="60" r="32" fill="none" stroke="currentColor" stroke-width="3"/>
            <circle cx="60" cy="60" r="26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 4"/>
            <circle cx="60" cy="60" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path fill="currentColor" d="M58.5 41.5 h3 v3 h-3 z"/>
          </g>
        </svg>
      </button>
      <span>4</span>
    </div>
    <h1>This page slipped off the assembly line.</h1>
    <p class="msg">The link may be old, or the page may have moved. Nothing here is broken, it just isn’t where you expected.</p>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="actions">
      <a class="btn fill" href="index.html">Back to home</a>
      <a class="btn" href="works.html">See projects</a>
      <a class="btn" href="contact.html">Contact me</a>
    </div>
  </div>
</main>
<script>
(function () {
  var bearingBtn = document.getElementById('bearingBtn');
  var hint = document.getElementById('hint');
  var ripple = document.getElementById('ripple');
  var sparkContainer = document.getElementById('sparks');
  var taps = 0;
  var lines = [
    'Lubricated the bearing. Still lost.',
    'Spinning smoothly. Keep going.',
    'High RPM achieved. Try Home?',
    'Engineers always find the right part. Try the menu.',
    'Okay, you found the easter egg. Home is one tap away.'
  ];

  function createSparks() {
    if (!sparkContainer) return;
    sparkContainer.innerHTML = '';
    var count = 12;
    for (var i = 0; i < count; i++) {
      var spark = document.createElement('div');
      spark.className = 'spark';
      var angle = (i / count) * 2 * Math.PI + (Math.random() * 0.3);
      var dist = 50 + Math.random() * 45;
      var tx = Math.cos(angle) * dist + 'px';
      var ty = Math.sin(angle) * dist + 'px';
      spark.style.left = '50%';
      spark.style.top = '50%';
      spark.style.setProperty('--tx', tx);
      spark.style.setProperty('--ty', ty);
      sparkContainer.appendChild(spark);
      (function(s) {
        setTimeout(function() {
          s.classList.add('act');
        }, 10);
      })(spark);
    }
  }

  bearingBtn.addEventListener('click', function () {
    taps++;
    bearingBtn.classList.add('fast');

    if (ripple) {
      ripple.classList.remove('act');
      void ripple.offsetWidth;
      ripple.classList.add('act');
    }

    createSparks();

    clearTimeout(bearingBtn._t);
    bearingBtn._t = setTimeout(function () { 
      bearingBtn.classList.remove('fast'); 
    }, 1800);

    hint.textContent = lines[Math.min(taps - 1, lines.length - 1)];
  });
})();
</script>
</body>
</html>
