<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard | Devadathan M</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#070b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&amp;family=Public+Sans:wght@300;400;500&amp;family=JetBrains+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<link href="admin/config.yml" type="text/yaml" rel="cms-config-url">
<style>
  :root {
    --bg: #070b10;
    --card: #0e141c;
    --txt: #f0f4f8;
    --mute: #8a99ad;
    --acc: #00d2ff;
    --line: rgba(255, 255, 255, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    background-color: var(--bg);
    color: var(--txt);
    font-family: 'Public Sans', sans-serif;
    overflow: hidden;
  }

  /* Blueprint Grid & Ambient Glow */
  .admin-blueprint {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.4;
    pointer-events: none;
  }

  .admin-glow {
    position: fixed;
    inset: -25%;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--acc) 15%, transparent), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* Glassmorphism Header Bar */
  .cms-nav {
    position: relative;
    z-index: 100;
    height: 68px;
    background-color: color-mix(in srgb, var(--card) 85%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
  }

  .cms-nav .brand {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 18px;
    color: var(--txt);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 14px;
    letter-spacing: -0.02em;
  }

  .cms-nav .brand span {
    color: var(--acc);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    padding: 4px 10px;
    background: color-mix(in srgb, var(--acc) 14%, transparent);
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--acc) 35%, transparent);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .nav-btn {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--mute);
    background: color-mix(in srgb, var(--card) 50%, transparent);
    cursor: pointer;
    text-decoration: none;
    padding: 9px 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    line-height: 1;
  }

  .nav-btn:hover {
    color: var(--txt);
    border-color: var(--acc);
    background: color-mix(in srgb, var(--acc) 10%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--acc) 20%, transparent);
  }

  /* Decap CMS Viewport Container */
  #nc-root {
    position: relative;
    z-index: 10;
    width: 100%;
    height: calc(100vh - 68px);
  }

  [data-netlify-cms-app] {
    background-color: transparent !important;
  }
</style>
</head>
<body>

  <div class="admin-blueprint" aria-hidden="true"></div>
  <div class="admin-glow" aria-hidden="true"></div>

  <header class="cms-nav">
    <a href="index.html" class="brand">
      Devadathan M <span>CMS Dashboard</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="nav-btn">← Exit to Site</a>
    </div>
  </header>

  <!-- Decap CMS Core Script -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
