backend:
  name: github
  repo: devadathanm/devadathanm.github.io
  branch: main
  base_url: https://decap-oauth.app--s.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_content/projects"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "date"}
      - {label: "Category / Tag", name: "category", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Project Description", name: "description", widget: "text"}
      - {label: "Key Outcome / Impact", name: "impact", widget: "string"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}