backend:
  name: github
  repo: devadathanm/devadathanm.github.io
  branch: main
  client_id: "Ov23liCySMbQ0YdWMk26"
  base_url: https://api.github.com

media_folder: "images"
public_folder: "/images"

media_processing:
  image_compression:
    max_file_size: 1048576
    resize:
      width: 1600
      height: 1600
      fit: inside

collections:
  - name: "projects"
    label: "Projects"
    folder: "_content/projects"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "date"}
      - {label: "Category / Tag", name: "category", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Project Description", name: "description", widget: "text"}
      - {label: "Key Outcome / Impact", name: "impact", widget: "string"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}